<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Listado de actividades')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main>
    <div class="encabezado-seccion">
        <h1>Listado de actividades</h1>
        <a th:href="@{/actividades/nueva}" class="btn">+ Nueva actividad</a>
    </div>

    <p class="alerta alerta-error" th:if="${error}" th:text="${error}">Error</p>
    <p class="alerta alerta-exito" th:if="${exito}" th:text="${exito}">OK</p>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Disciplina</th>
                <th>Días y horario</th>
                <th>Edades</th>
                <th>Cupo disp.</th>
                <th>Profesor/a</th>
                <th>Cuota</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(actividades)}">
                <td colspan="8">No hay actividades cargadas.</td>
            </tr>
            <tr th:each="act : ${actividades}" th:classappend="${cupos[act.id] <= 0} ? 'sin-cupo'">
                <td th:text="${act.nombre}">Nombre</td>
                <td th:text="${act.disciplina}">Disciplina</td>
                <td th:text="${act.dias + ' - ' + act.horario}">Días y horario</td>
                <td th:text="${act.edadMinima + ' a ' + act.edadMaxima + ' años'}">Edades</td>
                <td th:text="${cupos[act.id] + ' / ' + act.cupoMaximo}">Cupo disp.</td>
                <td th:text="${act.profesor}">Profesor/a</td>
                <td th:text="${'$ ' + #numbers.formatDecimal(act.cuotaMensual, 1, 'POINT', 0, 'COMMA')}">Cuota</td>
                <td>
                    <a th:href="@{/actividades/editar/{id}(id=${act.id})}" class="accion-editar">Editar</a>
                    |
                    <form th:action="@{/actividades/eliminar/{id}(id=${act.id})}" method="post"
                          class="form-inline" onsubmit="return confirm('¿Eliminar esta actividad?');">
                        <button type="submit" class="accion-eliminar">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/footer :: pie}"></footer>
</body>
</html>
