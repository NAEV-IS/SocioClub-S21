<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<main>
    <h1 th:text="${titulo}">Formulario de socio</h1>
    <p class="alerta alerta-error" role="alert" th:if="${error}" th:text="${error}">Error</p>
    <form th:action="@{/socios}" th:object="${socio}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="dni">DNI (sin puntos)</label>
        <input type="text" id="dni" th:field="*{dni}" inputmode="numeric" pattern="[0-9]{7,8}" maxlength="8" required>
        <p class="alerta alerta-error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}">DNI inválido</p>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" maxlength="255" required>
        <p class="alerta alerta-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Nombre inválido</p>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" th:field="*{apellido}" maxlength="255" required>
        <p class="alerta alerta-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Apellido inválido</p>

        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>
        <p class="alerta alerta-error" th:if="${#fields.hasErrors('fechaNacimiento')}">Ingresá una fecha de nacimiento válida, no futura.</p>

        <label for="email">Email (opcional)</label>
        <input type="email" id="email" th:field="*{email}" maxlength="255">
        <p class="alerta alerta-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email inválido</p>

        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono" th:field="*{telefono}" maxlength="255">
        <p class="alerta alerta-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">Teléfono inválido</p>

        <label for="estadoCuota">Estado de cuota</label>
        <select id="estadoCuota" th:field="*{estadoCuota}" required>
            <option value="AL_DIA">Al día</option>
            <option value="MOROSO">Moroso</option>
        </select>
        <p class="alerta alerta-error" th:if="${#fields.hasErrors('estadoCuota')}">Seleccioná un estado de cuota válido.</p>

        <div class="acciones-form">
            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/socios}" class="btn btn-cancelar">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: pie}"></footer>
</body>
</html>
